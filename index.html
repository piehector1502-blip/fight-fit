<!doctype html>
<html lang="it">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111318" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>FightFit</title>
  </head>
  <body>

      <h1 id="page-title">FightFit</h1>

    <!-- Each "page" is rendered here by the router in src/main.js -->

    <!-- Bottom navigation: hash links (#/timer, #/diet, ...) drive the router -->

      <a href="#/" data-route="/">Home</a>
      <a href="#/timer" data-route="/timer">Timer</a>
      <a href="#/workouts" data-route="/workouts">Allen.</a>
      <a href="#/diet" data-route="/diet">Dieta</a>
      <a href="#/weight" data-route="/weight">Peso</a>
      <a href="#/profile" data-route="/profile">Profilo</a>
    </nav>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
